<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de Contraseñas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <main class="container">
        <div class="card">

            <!-- Encabezado -->
            <div class="card__header">
                <div class="card__icon">🔐</div>
                <h1 class="card__title">Generador de Contraseñas</h1>
                <p class="card__subtitle">Crea contraseñas seguras al instante</p>
            </div>

            <!-- Campo de resultado -->
            <div class="output">
                <span class="output__password  is-placeholder" id="passwordDisplay">
                    Tu contraseña aparecerá aquí
                </span>
                <button class="output__copy-btn" id="copyBtn" aria-label="Copiar contraseña" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" />
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                    </svg>
                    <span class="output__copy-label" id="copyLabel">Copiar</span>
                </button>
            </div>

            <!-- Indicador de fortaleza -->
            <div class="strength">
                <div class="strength__bar-track">
                    <div class="strength__bar-fill" id="strengthBar"></div>
                </div>
                <span class="strength__label" id="strengthLabel">—</span>
            </div>

            <!-- Slider de longitud -->
            <div class="control">
                <div class="control__header">
                    <label class="control__label" for="lengthSlider">Longitud</label>
                    <span class="control__value" id="lengthValue">12</span>
                </div>
                <input class="slider" type="range" id="lengthSlider" min="8" max="32" value="12" />
            </div>

            <!-- Checkboxes de tipo de caracteres -->
            <div class="control">
                <label class="control__label">Incluir</label>
                <div class="options">

                    <label class="option" for="chkLower">
                        <input class="option__input" type="checkbox" id="chkLower" checked />
                        <span class="option__box"></span>
                        <span class="option__text">Minúsculas <em>abc</em></span>
                    </label>

                    <label class="option" for="chkUpper">
                        <input class="option__input" type="checkbox" id="chkUpper" checked />
                        <span class="option__box"></span>
                        <span class="option__text">Mayúsculas <em>ABC</em></span>
                    </label>

                    <label class="option" for="chkNumbers">
                        <input class="option__input" type="checkbox" id="chkNumbers" checked />
                        <span class="option__box"></span>
                        <span class="option__text">Números <em>123</em></span>
                    </label>

                    <label class="option" for="chkSymbols">
                        <input class="option__input" type="checkbox" id="chkSymbols" />
                        <span class="option__box"></span>
                        <span class="option__text">Símbolos <em>!@#</em></span>
                    </label>

                </div>
            </div>

            <!-- Mensaje de error -->
            <p class="error-msg" id="errorMsg" aria-live="polite"></p>

            <!-- Botón principal -->
            <button class="btn-generate" id="generateBtn">
                Generar contraseña
            </button>

        </div>
    </main>

    <script defer src="./app.js"></script>
</body>

</html>
